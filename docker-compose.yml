services:
  postgres:
    image: postgres:16-alpine
    container_name: securevault_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securevault}
      POSTGRES_USER: ${POSTGRES_USER:-securevault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securevault_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securevault_user} -d ${POSTGRES_DB:-securevault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/SecureVault.Api/Dockerfile
    container_name: securevault_api
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=${POSTGRES_DB:-securevault};Username=${POSTGRES_USER:-securevault_user};Password=${POSTGRES_PASSWORD:-securevault_pass}"
      Jwt__Secret: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-32ch}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-15}
      Jwt__RefreshExpiryDays: ${JWT_REFRESH_EXPIRY_DAYS:-7}
      Encryption__Key: ${ENCRYPTION_KEY:-default-encryption-key-change-in-production}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: securevault_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
